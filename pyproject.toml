[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "SIM", "UP"]
# Line length is the formatter's job; the remaining long lines are stylesheet and message literals.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["Test*.py"]
